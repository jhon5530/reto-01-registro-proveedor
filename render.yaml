# Blueprint de Render (plan gratuito). Las claves se ingresan en el panel de Render (sync: false):
# nunca quedan en el repositorio.
services:
  - type: web
    name: registro-proveedor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ACCESS_KEY
        sync: false
      - key: MAX_ITERACIONES
        value: "25"
      - key: MAX_TOKENS_SESION
        value: "200000"
      - key: MAX_TURNOS_SESION
        value: "40"
